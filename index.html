<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ふたりの立替・割り勘メモ</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 450px; margin: 15px auto; padding: 15px; background-color: #f8f9fa; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
    h2, h3 { text-align: center; color: #333; margin-top: 5px; }
    .result { font-size: 1.1em; font-weight: bold; background: #eef6ff; color: #0056b3; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 10px; border: 1px solid #bce0fd; }
    .form-group { margin-bottom: 10px; }
    label { display: block; margin-bottom: 4px; font-size: 0.85em; color: #666; font-weight: bold; }
    input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em; margin-bottom: 8px; }
    .btn-submit { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1em; cursor: pointer; }
    .btn-settle { width: 100%; padding: 10px; background: #17a2b8; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 0.9em; cursor: pointer; margin-top: 5px; }
    .btn-delete { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75em; cursor: pointer; margin-left: 8px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 0.85em; display: flex; justify-content: space-between; align-items: center; }
    .item-info { flex-grow: 1; }
    .item-title { font-weight: bold; color: #333; }
    .item-sub { color: #666; font-size: 0.85em; margin-top: 2px; }
    
    /* アコーディオン用スタイル */
    .settlement-block { background: #f1f3f5; border-radius: 8px; margin-bottom: 10px; font-size: 0.85em; overflow: hidden; border: 1px solid #e9ecef; }
    .settlement-header { display: flex; justify-content: space-between; align-items: center; padding: 12px; cursor: pointer; user-select: none; transition: background 0.2s; }
    .settlement-header:hover { background: #e9ecef; }
    .settlement-title-info { display: flex; align-items: center; gap: 6px; font-weight: bold; color: #495057; }
    .accordion-icon { font-size: 0.75em; color: #6c757d; transition: transform 0.2s; }
    .settlement-details { padding: 12px; border-top: 1px dashed #dee2e6; background: #fafafa; display: none; color: #555; }
    .settlement-details.open { display: block; }
  </style>
</head>
<body>

  <h2>ふたりの立替・割り勘メモ</h2>

  <!-- 現在の清算結果 -->
  <div class="card">
    <div class="result" id="resultBox">計算中...</div>
    <button class="btn-settle" onclick="settleUp()">精算を完了して清算額をリセット</button>
  </div>

  <!-- 入力フォーム -->
  <div class="card">
    <div class="form-group">
      <label>誰が払った？</label>
      <select id="payer">
        <option value="ゆうすけ">ゆうすけ</option>
        <option value="うらら">うらら</option>
      </select>

      <label>項目（カテゴリー）</label>
      <select id="category">
        <option value="食費">食費</option>
        <option value="外食代">外食代</option>
        <option value="日用品">日用品</option>
        <option value="家賃">家賃</option>
        <option value="光熱費">光熱費</option>
        <option value="交通費">交通費</option>
        <option value="娯楽・レジャー">娯楽・レジャー</option>
        <option value="旅行">旅行</option>
        <option value="その他">その他</option>
      </select>

      <label>金額（円）</label>
      <input type="number" id="amount" placeholder="例: 3000">

      <label>詳細・メモ（任意）</label>
      <input type="text" id="title" placeholder="例: スーパーでの買い物">

      <label>割り方</label>
      <select id="splitType">
        <option value="EQUAL">折半（割り勘）</option>
        <option value="PAY_ALL">全額立替</option>
      </select>

      <button class="btn-submit" onclick="addTransaction()">記録を追加する</button>
    </div>
  </div>

  <!-- 未精算の履歴 -->
  <div class="card">
    <h3>未精算の記録</h3>
    <ul id="historyList"></ul>
  </div>

  <!-- 精算済みの過去ログ -->
  <div class="card">
    <h3>精算済みの過去履歴</h3>
    <div id="settledHistoryList"></div>
  </div>

  <script>
    // データ初期化（ローカルストレージから読み込み）
    let transactions = JSON.parse(localStorage.getItem('pair_transactions')) || [];
    let settledGroups = JSON.parse(localStorage.getItem('pair_settled_groups')) || [];

    function saveData() {
      localStorage.setItem('pair_transactions', JSON.stringify(transactions));
      localStorage.setItem('pair_settled_groups', JSON.stringify(settledGroups));
    }

    function addTransaction() {
      const payer = document.getElementById('payer').value;
      const category = document.getElementById('category').value;
      const amount = Number(document.getElementById('amount').value);
      const titleInput = document.getElementById('title').value;
      const title = titleInput ? `${category}（${titleInput}）` : category;
      const splitType = document.getElementById('splitType').value;

      if (!amount || amount <= 0) {
        alert('正しい金額を入力してください');
        return;
      }

      const newRecord = {
        id: Date.now(),
        payer,
        amount,
        title,
        splitType,
        date: new Date().toLocaleDateString('ja-JP')
      };

      transactions.push(newRecord);
      saveData();

      document.getElementById('amount').value = '';
      document.getElementById('title').value = '';

      updateView();
    }

    function deleteTransaction(id) {
      if (confirm('この記録を削除しますか？')) {
        transactions = transactions.filter(t => t.id !== id);
        saveData();
        updateView();
      }
    }

    function deleteSettledGroup(id, event) {
      // 親要素（アコーディオン開閉）へのクリックイベント伝播を防止
      event.stopPropagation();
      
      if (confirm('この精算履歴を削除しますか？（復元はできません）')) {
        settledGroups = settledGroups.filter(g => g.id !== id);
        saveData();
        updateView();
      }
    }

    function toggleAccordion(id) {
      const details = document.getElementById(`details-${id}`);
      const icon = document.getElementById(`icon-${id}`);
      if (details) {
        const isOpen = details.classList.contains('open');
        if (isOpen) {
          details.classList.remove('open');
          icon.textContent = '▶';
        } else {
          details.classList.add('open');
          icon.textContent = '▼';
        }
      }
    }

    function settleUp() {
      if (transactions.length === 0) {
        alert('未精算の記録がありません。');
        return;
      }

      if (confirm('現在の精算を完了し、残高を0にリセットしますか？')) {
        const settledDate = new Date().toLocaleString('ja-JP');
        settledGroups.unshift({
          id: Date.now(),
          date: settledDate,
          items: [...transactions]
        });
        transactions = [];
        saveData();
        updateView();
      }
    }

    function updateView() {
      let balance = 0; // 正なら「うらら➔ゆうすけ」、負なら「ゆうすけ➔うらら」
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';

      if (transactions.length === 0) {
        historyList.innerHTML = '<li style="justify-content: center; color: #888;">未精算の記録はありません</li>';
      }

      transactions.forEach((t) => {
        const half = t.amount / 2;
        if (t.splitType === 'EQUAL') {
          if (t.payer === 'ゆうすけ') balance += half;
          if (t.payer === 'うらら') balance -= half;
        } else {
          if (t.payer === 'ゆうすけ') balance += t.amount;
          if (t.payer === 'うらら') balance -= t.amount;
        }

        const li = document.createElement('li');
        const typeText = t.splitType === 'EQUAL' ? '折半' : '全額立替';
        
        li.innerHTML = `
          <div class="item-info">
            <div class="item-title">${t.title} - ${t.amount.toLocaleString()}円</div>
            <div class="item-sub">${t.date} / ${t.payer}が支払い (${typeText})</div>
          </div>
          <button class="btn-delete" onclick="deleteTransaction(${t.id})">削除</button>
        `;
        historyList.appendChild(li);
      });

      // 精算結果を表示
      const resultBox = document.getElementById('resultBox');
      if (balance > 0) {
        resultBox.textContent = `うらら ➔ ゆうすけ へ ${balance.toLocaleString()}円 支払う`;
      } else if (balance < 0) {
        resultBox.textContent = `ゆうすけ ➔ うらら へ ${Math.abs(balance).toLocaleString()}円 支払う`;
      } else {
        resultBox.textContent = `貸し借りなし（清算済み）`;
      }

      // 過去の精算履歴を表示
      const settledList = document.getElementById('settledHistoryList');
      settledList.innerHTML = '';

      if (settledGroups.length === 0) {
        settledList.innerHTML = '<p style="text-align: center; color: #888; font-size: 0.85em;">過去の精算履歴はありません</p>';
      } else {
        settledGroups.forEach((group) => {
          const totalAmount = group.items.reduce((sum, item) => sum + item.amount, 0);
          const div = document.createElement('div');
          div.className = 'settlement-block';
          
          let itemsHtml = group.items.map(i => {
            const typeText = i.splitType === 'EQUAL' ? '折半' : '全額立替';
            return `・${i.title}: ${i.amount.toLocaleString()}円 (${i.payer}立替 / ${typeText})`;
          }).join('<br>');

          div.innerHTML = `
            <div class="settlement-header" onclick="toggleAccordion(${group.id})">
              <div class="settlement-title-info">
                <span class="accordion-icon" id="icon-${group.id}">▶</span>
                <div>
                  <div>${group.date}</div>
                  <div style="font-size: 0.85em; color: #666; font-weight: normal;">
                    ${group.items.length}件 / 計 ${totalAmount.toLocaleString()}円
                  </div>
                </div>
              </div>
              <button class="btn-delete" onclick="deleteSettledGroup(${group.id}, event)">削除</button>
            </div>
            <div class="settlement-details" id="details-${group.id}">
              ${itemsHtml}
            </div>
          `;
          settledList.appendChild(div);
        });
      }
    }

    // 初期表示
    updateView();
  </script>
</body>
</html>
