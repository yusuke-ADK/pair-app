<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>立替メモ & 割り勘ルーレット</title>
  <style>
    /* 全体スタイル */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
    }

    /* カード風ブロック */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative; /* 右下ボタン配置のため */
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: #666;
      margin-bottom: 12px;
    }

    /* フォーム要素 */
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #777;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    /* 「ｷﾞｬﾝﾌﾞる？」ミニボタン */
    .btn-gamble-mini {
      position: absolute;
      right: 16px;
      bottom: 16px;
      font-size: 0.75rem;
      padding: 4px 10px;
      background: #f0f0f0;
      color: #555;
      border: 1px dashed #aaa;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-gamble-mini:hover {
      background: #ffe600;
      color: #000;
      border-color: #000;
      transform: scale(1.08) rotate(-2deg);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    /* メンバータグリスト */
    .member-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .tag {
      background: #eef2f5;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tag-remove {
      cursor: pointer;
      color: #999;
      font-weight: bold;
    }

    /* ボタン共通 */
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* ルーレット用モーダル（ポップアップ） */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      width: 90%;
      max-width: 360px;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    
    /* ルーレット表示領域 */
    .roulette-display {
      font-size: 1.8rem;
      font-weight: bold;
      height: 80px;
      line-height: 80px;
      background: #f8f9fa;
      border: 2px solid #333;
      border-radius: 12px;
      margin: 20px 0;
      color: #007aff;
      overflow: hidden;
    }
    
    .btn-spin {
      background: #ff3b30;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 24px;
      cursor: pointer;
      width: 100%;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: #888;
      margin-top: 12px;
      cursor: pointer;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>立替メモ</h1>

    <!-- 参加者設定カード -->
    <div class="card">
      <div class="card-title">👥 参加者メンバー</div>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="member-input" placeholder="名前を入力">
        <button onclick="addMember()" style="padding: 0 16px; border-radius: 8px; border:1px solid #ccc; cursor:pointer;">追加</button>
      </div>
      <div class="member-tags" id="member-list"></div>
    </div>

    <!-- 入力カード（右下にギャンブルボタン付き） -->
    <div class="card" style="padding-bottom: 48px;">
      <div class="card-title">💸 お支払いの入力</div>
      
      <div class="form-group">
        <label>内容</label>
        <input type="text" id="item-title" placeholder="例：居酒屋、タクシー代">
      </div>
      <div class="form-group">
        <label>金額（円）</label>
        <input type="number" id="item-amount" placeholder="0">
      </div>

      <!--  入力ブロック右下の「ｷﾞｬﾝﾌﾞる？」ボタン -->
      <button class="btn-gamble-mini" onclick="openGambleModal()">🎲 ｷﾞｬﾝﾌﾞる？</button>
    </div>
  </div>

  <!-- 🎲 割り方決めルーレット モーダル -->
  <div class="modal-overlay" id="gamble-modal">
    <div class="modal-content">
      <h2 style="margin:0; font-size: 1.2rem;">🎲 割り方決めルーレット</h2>
      <p style="font-size: 0.8rem; color: #666; margin-top: 4px;">本日の男気（全額支払い）は誰だ！？</p>

      <div class="roulette-display" id="roulette-display">❓</div>

      <button class="btn-spin" id="spin-btn" onclick="startRoulette()">ルーレットを回す！</button>
      <br>
      <button class="btn-close" onclick="closeGambleModal()">閉じる</button>
    </div>
  </div>

  <script>
    // メンバー管理データ
    let members = ["たろう", "はなこ", "じろう"];

    // 初開時にメンバー表示
    renderMembers();

    // メンバー表示処理
    function renderMembers() {
      const container = document.getElementById('member-list');
      container.innerHTML = '';
      members.forEach((m, index) => {
        container.innerHTML += `
          <div class="tag">
            ${m}
            <span class="tag-remove" onclick="removeMember(${index})">×</span>
          </div>
        `;
      });
    }

    // メンバー追加
    function addMember() {
      const input = document.getElementById('member-input');
      const name = input.value.trim();
      if (name) {
        members.push(name);
        input.value = '';
        renderMembers();
      }
    }

    // メンバー削除
    function removeMember(index) {
      members.splice(index, 1);
      renderMembers();
    }

    // --- ルーレット処理 --- //

    // モーダルを開く
    function openGambleModal() {
      if (members.length < 2) {
        alert("ｷﾞｬﾝﾌﾞるには、参加者を2人以上登録してね！");
        return;
      }
      document.getElementById('roulette-display').innerText = '❓';
      document.getElementById('spin-btn').disabled = false;
      document.getElementById('gamble-modal').style.display = 'flex';
    }

    // モーダルを閉じる
    function closeGambleModal() {
      document.getElementById('gamble-modal').style.display = 'none';
    }

    // ルーレット回転演出 & 完全フラット抽選
    function startRoulette() {
      const display = document.getElementById('roulette-display');
      const spinBtn = document.getElementById('spin-btn');
      spinBtn.disabled = true; // 連打防止

      // 完全フラット（Math.random）で当選者を決定
      const winnerIndex = Math.floor(Math.random() * members.length);
      const winner = members[winnerIndex];

      let speed = 50;  // 切り替わり速度（ミリ秒）
      let counter = 0;
      const totalSwitches = 25; // カチカチ切り替わる回数

      // アニメーション処理
      function switchName() {
        // 表示をランダム切り替え
        const randomName = members[counter % members.length];
        display.innerText = randomName;
        counter++;

        if (counter < totalSwitches) {
          setTimeout(switchName, speed);
        } else {
          // 最後に完全平等に選ばれた当選者を表示！
          display.innerText = `👑 ${winner}`;
          display.style.color = "#ff3b30";
          setTimeout(() => {
            alert(`🎉 今回の全額奢りは 【${winner}】 さんに決定！`);
            display.style.color = "#007aff";
          }, 300);
        }
      }

      switchName();
    }
  </script>
</body>
</html>
